name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

# No cancel-in-progress: a publish cancelled mid-upload can leave PyPI in a
# partial state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# Any default-branch run can write setup-poetry's caches. A poisoned entry
# restored here would ship in the published distribution.
jobs:
  # Review protects only the default branch, and a tag can name any commit.
  require-default-branch:
    name: Require the release tag on the default branch
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: compare the tag with the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq .status)"
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on $DEFAULT_BRANCH"
            exit 1
          fi

  build:
    name: Build the distribution
    needs: require-default-branch
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-poetry
        with:
          cache: false
      - name: poetry build
        run: poetry build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Tests the downloaded artifact, the same files pypi uploads.
  test-distribution:
    name: Test the distribution
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-poetry
        with:
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: ./.github/actions/test-distribution

  pypi:
    name: Publish to PyPI
    # A separate build keeps `id-token: write` out of scope while the build
    # backend and its dependencies run.
    needs: test-distribution
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # PyPI matches the Trusted Publisher against repo, workflow filename, and
    # environment. Renaming this file or the environment stops publishing
    # until the publisher on PyPI matches again.
    environment: pypi
    permissions:
      # This job checks nothing out, so `contents` is deliberately absent.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
