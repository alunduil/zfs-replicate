name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

# No cancel-in-progress: a publish cancelled mid-upload can leave PyPI in a
# partial state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # PyPI pins the Trusted Publisher it accepts to repo + workflow file +
    # environment, so the OIDC token this job mints is only valid from here.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install poetry
        run: pipx install 'poetry<3'
      - name: setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: poetry
      - name: poetry build
        run: poetry build
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
