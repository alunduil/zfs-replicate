name: Daily

# On-the-hour schedules queue behind platform peak load.
on:
  schedule:
    - cron: '47 6 * * *'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # No cancel-in-progress: a truncated sweep loses the operations-per-run
  # resume cache and restarts from the first pull request.
  group: ${{ github.workflow }}

jobs:
  stale-pull-requests:
    name: Prune stale pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # `actions: write` is omitted: it covers only the resume cache, so a
      # truncated run warns and restarts rather than failing.
      issues: write
      pull-requests: write
    steps:
      # An issue already carrying the label would otherwise stay eligible for
      # closing.
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: no-pr-activity
          # Closing a Renovate pull request tells Renovate the version is
          # unwanted and it will not re-offer it. Renovate labels nothing by
          # default, so this depends on renovate.json applying the label.
          exempt-pr-labels: blocked,dependencies
          stale-pr-message: >-
            This has been quiet for 30 days, so it's picked up a stale label. A
            comment or a push clears the label and restarts the clock. Otherwise
            this closes in another 14 days.
          close-pr-message: >-
            Closing this after 44 quiet days. That isn't a call on the change
            itself, and nothing is lost: the branch stays where it is, so
            comment here if you want to pick it back up and I'll reopen it.

  python-matrix:
    name: Check Python matrix drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # A job-level block replaces the workflow-level one rather than
      # merging, so the checkout needs `contents` named again here.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect drift
        id: check
        run: .github/scripts/check-python-matrix.sh

      # Title and labels come from the file's front matter, not from `with`.
      # Updating one issue keeps its table current instead of accruing one
      # issue per run.
      - name: File or refresh drift issue
        if: steps.check.outputs.drift == 'true'
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: python-drift-issue.md
          update_existing: true

  # Reports the score and never fails on it, so the number is something to act
  # on in its own change.
  mutation-score:
    name: Score mutant detection
    runs-on: ubuntu-24.04
    # The sweep runs serially, so the cap is headroom for a slow runner.
    timeout-minutes: 120
    permissions:
      # A job-level block replaces the workflow-level one rather than
      # merging, so the checkout needs `contents` named again here.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-poetry
      - name: poetry install --with mutation
        run: poetry install --with mutation
      # Serial keeps the verdicts reproducible: the parallel runner
      # mis-attributes child exit codes here, so the same mutant reports killed
      # on one run and survived on the next.
      - name: poetry run mutmut run
        run: poetry run mutmut run --max-children 1
      # No `if: always()`: a sweep that died partway exports a partial tally,
      # and the issue is better left holding the last number a full run
      # produced.
      - name: Render the score
        run: |
          poetry run mutmut export-cicd-stats
          .github/scripts/mutation-summary.sh

      # Title comes from the file's front matter, not from `with`. Updating one
      # issue keeps the current score in place instead of accruing one issue
      # per night.
      - name: File or refresh the score issue
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: mutation-score-issue.md
          update_existing: true

  # A release inside the declared ranges can turn this red with no change here,
  # so it runs on a schedule rather than gating unrelated pull requests.
  dependency-ceiling:
    name: Test the newest dependency releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # A job-level block replaces the workflow-level one rather than
      # merging, so the checkout needs `contents` named again here.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-poetry
      # Resolves every range in pyproject.toml afresh rather than from
      # poetry.lock, and logs each version that moves off the lock.
      - name: poetry update
        run: poetry update
      - name: poetry run pytest
        id: pytest
        run: poetry run pytest

      # Only a test failure files the issue, so an index outage during the
      # update reddens the run without claiming a dependency broke the suite.
      - name: Render the failure
        if: failure() && steps.pytest.outcome == 'failure'
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "---"
            echo "title: Newest dependency releases fail the suite"
            echo "labels:"
            echo "  - dependencies"
            echo "---"
            echo "The nightly \`Test the newest dependency releases\` job failed"
            echo "against the newest runtime releases pyproject.toml allows:"
            echo
            echo '```text'
            poetry show --only main --top-level
            echo '```'
            echo
            echo "See [the failing run]($run_url). Fix the incompatibility, or"
            echo "lower the ceiling in pyproject.toml if the release drops"
            echo "something this project needs."
          } > dependency-ceiling-issue.md

      # Title and labels come from the file's front matter, not from `with`.
      # Updating one issue keeps the latest failure in place instead of accruing
      # one issue per night.
      - name: File or refresh the failure issue
        if: failure() && steps.pytest.outcome == 'failure'
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: dependency-ceiling-issue.md
          update_existing: true
