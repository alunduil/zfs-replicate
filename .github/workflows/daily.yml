name: Daily

# On-the-hour schedules queue behind platform peak load.
on:
  schedule:
    - cron: '47 6 * * *'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # No cancel-in-progress: a truncated sweep loses the operations-per-run
  # resume cache and restarts from the first pull request.
  group: ${{ github.workflow }}

jobs:
  stale-pull-requests:
    name: Prune stale pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # `actions: write` is omitted: it covers only the resume cache, so a
      # truncated run warns and restarts rather than failing.
      issues: write
      pull-requests: write
    steps:
      # An issue already carrying the label would otherwise stay eligible for
      # closing.
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: no-pr-activity
          # Closing a Renovate pull request tells Renovate the version is
          # unwanted and it will not re-offer it. Renovate labels nothing by
          # default, so this depends on renovate.json applying the label.
          exempt-pr-labels: blocked,dependencies
          stale-pr-message: >-
            This has been quiet for 30 days, so it's picked up a stale label. A
            comment or a push clears the label and restarts the clock. Otherwise
            this closes in another 14 days.
          close-pr-message: >-
            Closing this after 44 quiet days. That isn't a call on the change
            itself, and nothing is lost: the branch stays where it is, so
            comment here if you want to pick it back up and I'll reopen it.

  python-matrix:
    name: Check Python matrix drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # A job-level block replaces the workflow-level one rather than
      # merging, so the checkout needs `contents` named again here.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect drift
        id: check
        run: |
          set -euo pipefail

          # The v1 endpoint computes `isEol` server-side. The v0 endpoint
          # reports Python's `eol` as a date rather than the `false` that
          # collection-json.hs keys on for GHC, so v1 avoids doing date
          # arithmetic against the runner clock.
          expected=$(curl -fsSL https://endoflife.date/api/v1/products/python \
            | jq -r '.result.releases
                     | map(select(.isEol == false))
                     | .[].name' \
            | sort -V)

          # An empty set on any side means an upstream schema change or a
          # moved field. Abort rather than file drift against nothing.
          if [ -z "$expected" ]; then
            echo "endoflife.date returned no live Python releases; aborting" >&2
            exit 1
          fi

          # The `3.x` leg lives under `include:`, so it stays out of the
          # comparison: it tracks whatever ships next by design.
          tests=$(yq '.jobs.python-tests.strategy.matrix.python-version[]' \
            .github/workflows/ci.yml | sort -V)
          cli=$(yq '.jobs.cli-entry-point.strategy.matrix.python-version[]' \
            .github/workflows/ci.yml | sort -V)

          # requires-python is PEP 621, so this survives the uv migration in
          # #619 in a way that reading a [tool.poetry] key would not.
          floor=$(grep -oE '^requires-python = ">=[0-9]+\.[0-9]+' pyproject.toml \
            | grep -oE '[0-9]+\.[0-9]+$')

          if [ -z "$tests" ] || [ -z "$cli" ] || [ -z "$floor" ]; then
            echo "could not parse the CI matrices or requires-python; aborting" >&2
            exit 1
          fi

          # The floor is reported but never triggers: raising it drops users
          # and is breaking, so it belongs to #398 rather than to a `ci` fix.
          drift=false
          [ "$expected" = "$tests" ] || drift=true
          [ "$expected" = "$cli" ] || drift=true
          echo "drift=$drift" >> "$GITHUB_OUTPUT"

          join() { printf '%s' "$1" | paste -sd, -; }
          # create-an-issue reads the title and labels from front matter.
          {
            echo "---"
            echo "title: Python version matrix out of date"
            echo "labels:"
            echo "  - python"
            echo "---"
            echo "The CI matrices should name every CPython release upstream"
            echo "still supports, per the comment above the matrix in"
            echo "\`.github/workflows/ci.yml\`."
            echo
            echo "| Source | Versions |"
            echo "| --- | --- |"
            echo "| Expected (endoflife.date, not end-of-life) | $(join "$expected") |"
            echo "| \`python-tests\` matrix | $(join "$tests") |"
            echo "| \`cli-entry-point\` matrix | $(join "$cli") |"
            echo
            echo "Update both matrices in the same \`ci\` change."
            echo
            echo "\`requires-python\` currently floors at $floor. Raising it drops"
            echo "users still on that release, so it is breaking and belongs to"
            echo "#398, not here."
          } > python-drift-issue.md

      # update_existing overwrites the open issue with the same title rather
      # than filing a duplicate, so the table always shows the current
      # mismatch. Title and labels come from the front matter above.
      - name: File or refresh drift issue
        if: steps.check.outputs.drift == 'true'
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: python-drift-issue.md
          update_existing: true
