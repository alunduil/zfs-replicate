name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Unpinned, mypy and vulture would target the newest CPython that
      # requires-python allows, which only the experimental matrix leg tests.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: tox-dev/action-pre-commit-uv@e09b8958484dfe71f4ac3bc7afb230ba506402ec # v1.0.5

  python-tests:
    # Matrix jobs take the explicit name verbatim, so interpolate the version
    # or all four legs collide on one check name.
    name: Test python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"  # EOL 2026-10
          - "3.11"  # EOL 2027-10
          - "3.12"  # EOL 2028-10
        experimental: [false]
        include:
          - python-version: 3.x
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-poetry
        with:
          python-version: ${{ matrix.python-version }}
      - name: poetry install
        run: poetry install
      - name: poetry run pytest
        run: poetry run pytest
      - name: poetry run coveralls
        if: matrix.python-version == '3.x'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          poetry run pytest
          poetry run coveralls --service=github || poetry run coveralls --service=github-actions

  cli-entry-point:
    name: Check CLI entry point ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"  # EOL 2026-10
          - "3.11"  # EOL 2027-10
          - "3.12"  # EOL 2028-10
        experimental: [false]
        include:
          - python-version: 3.x
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-poetry
        with:
          python-version: ${{ matrix.python-version }}
      - name: poetry install
        run: poetry install
      - name: zfs-replicate --help
        run: poetry run -- zfs-replicate --help

  build:
    name: Build the distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-poetry
        with:
          python-version: "3.12"
      - name: poetry build
        run: |
          poetry build
          tar -zvtf dist/zfs_replicate-*.tar.gz | grep zfs/replicate/
          tar -zvtf dist/zfs_replicate-*.tar.gz | grep zfs_test/replicate_test/
      - name: poetry check
        run: poetry check

  # Squash-merge lands the PR title as the commit message, so the title, not the
  # individual commits, is what release-please parses for version bumps. Keep
  # the type list in sync with CONTRIBUTING and the conventional-pre-commit hook.
  #
  # A corrected title revalidates on the next push or a manual re-run, not on
  # the edit itself.
  pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert

  dependency-review:
    name: Review dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
