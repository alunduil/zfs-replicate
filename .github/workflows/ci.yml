name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # Unpinned, mypy and vulture would target the newest CPython that
      # requires-python allows, which only the experimental matrix leg tests.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: tox-dev/action-pre-commit-uv@9316eafda3550b0365575c60b9f53725a81d0cfd # v1.1.2

  fix-renovate-hooks:
    name: Fix hooks on the Renovate branch
    uses: alunduil/renovate-config/.github/workflows/fix-renovate-hooks.yml@a1e682888c110e119d64118063bc733c807af738 # main
    permissions:
      contents: read
      id-token: write

  check-renovate-commits:
    name: Check Renovate branch commits
    uses: alunduil/renovate-config/.github/workflows/check-renovate-commits.yml@6052341d076d02929cd58ba8a5245d4cf13955af # main
    permissions:
      contents: read
      pull-requests: read

  python-tests:
    # Matrix jobs take the explicit name verbatim, so interpolate the version
    # or every leg collides on one check name.
    name: Test python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every non-EOL CPython release, per
        # https://devguide.python.org/versions/. The oldest entry matches the
        # requires-python floor in pyproject.toml, so removing it raises the
        # floor: a breaking change.
        python-version:
          - "3.11"  # EOL 2027-10
          - "3.12"  # EOL 2028-10
          - "3.13"  # EOL 2029-10
          - "3.14"  # EOL 2030-10
          - "3.15"  # EOL 2031-10
    steps: &python-tests-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-poetry
        with:
          python-version: ${{ matrix.python-version }}
      - name: poetry install
        run: poetry install
      - name: poetry run pytest
        run: poetry run pytest
      - name: poetry run zfs-replicate --help
        run: poetry run -- zfs-replicate --help

  # A failure on the newest CPython warns ahead of the matrix without blocking
  # a merge.
  python-tests-next:
    name: Test python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      matrix:
        python-version: [3.x]
    steps: *python-tests-steps

  # Coverage measures which lines ran, so every matrix leg would upload the
  # same report. A job of its own also keeps a Codecov outage out of a check
  # named for a Python version.
  coverage:
    name: Report coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # A job-level block replaces the workflow-level one rather than
      # merging, so the checkout needs `contents` named again here.
      contents: read
      # codecov-action authenticates by OIDC, so there is no upload token to
      # store or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-poetry
      - name: poetry install
        run: poetry install
      - name: poetry run pytest --cov
        run: poetry run pytest --cov --cov-report=xml
      # Forks get no OIDC token, so the action uploads their coverage without
      # one. Codecov accepts tokenless uploads for a public repository.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: true

  build:
    name: Build the distribution
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-poetry
      - name: poetry build
        run: poetry build
      - name: poetry check
        run: poetry check
      - uses: ./.github/actions/test-distribution

  # Squash-merge lands the PR title as the commit message, so the title, not the
  # individual commits, is what release-please parses for version bumps. Keep
  # the type list in sync with CONTRIBUTING and the conventional-pre-commit hook.
  #
  # A corrected title revalidates on the next push or a manual re-run, not on
  # the edit itself.
  pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert

  dependency-review:
    name: Review dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

  # No other job executes daily.yml, so the dry run is the only test of a
  # runner image or action update to it before merge.
  daily-changes:
    name: Detect daily.yml changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.files.outputs.changed }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/files" \
            --jq '.[].filename | select(. == ".github/workflows/daily.yml")')
          echo "changed=$([[ -n $files ]] && echo true || echo false)" >>"${GITHUB_OUTPUT}"

  # A called workflow can only narrow the grant it receives, so this grant
  # matches daily.yml's jobs; a permission added there belongs here too. The
  # dry-run input skips the writes.
  dry-run-daily:
    name: Dry-run Daily
    needs: daily-changes
    if: needs.daily-changes.outputs.changed == 'true'
    uses: ./.github/workflows/daily.yml
    with:
      dry-run: true
    permissions:
      contents: read
      issues: write
      pull-requests: write

  # The default-branch ruleset requires this check by name, so renaming the
  # job breaks the merge gate.
  results:
    name: Check CI results
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs:
      - pre-commit
      - python-tests
      - coverage
      - build
      - pr-title
      - dependency-review
      - daily-changes
      - dry-run-daily
    if: always()
    steps:
      # Pull-request-only jobs skip on a push, and the Daily dry run skips on
      # a pull request that leaves daily.yml alone.
      - name: Fail when any job did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status '
            (.["daily-changes"].outputs.changed == "false") as $daily_unchanged
            | def may_skip:
                $ENV.GITHUB_EVENT_NAME != "pull_request"
                or (.key == "dry-run-daily" and $daily_unchanged);
            all(to_entries[];
              .value.result == "success"
              or (.value.result == "skipped" and may_skip))
          ' <<<"$NEEDS"
