name: Set up uv
description: Install uv from mise.lock and Python for a given version, with an optional tool cache.

# No `uv sync`: callers that run project code install the environment
# themselves, so callers that only build or inspect skip the cost.
#
# A local composite action can't check out the repo it lives in, so
# callers run actions/checkout before invoking it.
inputs:
  python-version:
    description: >-
      Defaults to .github/.python-version, which sits outside the repository
      root so that uv and pyenv leave local shells unpinned.
    required: false
  cache:
    description: Restore and save the mise tool cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: install uv
      uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        cache: ${{ inputs.cache }}
    - name: setup python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.python-version }}
        # setup-python warns when it receives both inputs.
        python-version-file: ${{ inputs.python-version == '' && '.github/.python-version' || '' }}
    # uv would otherwise prefer a Python it manages, or download one, over the
    # matrix interpreter that setup-python put first on PATH.
    - name: keep uv on that python
      shell: bash
      run: echo "UV_PYTHON_PREFERENCE=only-system" >> "${GITHUB_ENV}"
