name: Test the distribution
description: Run the packaged test suite against the wheel and the sdist in dist/.

# Catches a module or test file missing from `packages`: the suite runs
# against what each distribution ships, not the checkout.
#
# Callers check out the repository and run setup-uv first: the test
# dependencies come from its uv.lock.
runs:
  using: composite
  steps:
    - name: test the wheel and the sdist
      shell: bash
      run: |
        # dist/ holds a single build, so each glob matches one file.
        wheels=(dist/zfs_replicate-*.whl)
        sdists=(dist/zfs_replicate-*.tar.gz)

        # The wheel ships no tests, so both runs take the suite from the
        # sdist. Extracting only the tests keeps the packaged sources out of
        # the way, so `import zfs` resolves to the installed distribution.
        packaged_tests="${RUNNER_TEMP}/packaged-tests"
        mkdir --parents "${packaged_tests}"
        tar --extract --gzip --file "${sdists[0]}" --directory "${packaged_tests}" \
          --strip-components=1 --wildcards '*/zfs_test/*' '*/pyproject.toml'

        uv sync --locked --no-install-project
        # setup-uv's UV_PYTHON would otherwise send uv pip to the runner's
        # interpreter instead of this environment.
        venv="${PWD}/.venv"
        for distribution in "${wheels[0]}" "${sdists[0]}"; do
          # --no-deps keeps the pins uv.lock installed above, so an
          # upstream release cannot redden this step.
          uv pip install --python "${venv}/bin/python" --no-deps "${distribution}"
          (cd "${packaged_tests}" && "${venv}/bin/pytest")
          uv pip uninstall --python "${venv}/bin/python" zfs-replicate
        done
