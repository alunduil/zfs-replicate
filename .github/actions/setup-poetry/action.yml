name: Set up Poetry
description: Install Poetry and Python for a given version, with Poetry's download cache.

# No `poetry install`: callers that run project code install the environment
# themselves, so callers that only build or inspect skip the cost.
#
# A local composite action can't check out the repo it lives in, so
# callers run actions/checkout before invoking it.
inputs:
  python-version:
    description: >-
      Defaults to .github/.python-version, which sits outside the repository
      root so that uv and pyenv leave local shells unpinned.
    required: false

runs:
  using: composite
  steps:
    # setup-python's poetry cache asks Poetry for its cache path, so Poetry
    # installs first.
    - name: install poetry
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
    - name: setup python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.python-version }}
        # setup-python warns when it receives both inputs.
        python-version-file: ${{ inputs.python-version == '' && '.github/.python-version' || '' }}
        cache: poetry
