name: Set up Poetry
description: Install Poetry and Python for a given version, with Poetry's download cache.

# No `poetry install`: callers that run project code install the environment
# themselves, so callers that only build or inspect skip the cost.
#
# A local composite action can't check out the repo it lives in, so
# callers run actions/checkout before invoking it.
inputs:
  python-version:
    description: >-
      Python version passed to actions/setup-python. Omit it to use
      .github/.python-version, the single pin that Renovate's pyenv manager
      keeps current.
    required: false

runs:
  using: composite
  steps:
    - name: install poetry
      shell: bash
      run: pipx install 'poetry<3'
    - name: setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python-version }}
        # setup-python warns when both inputs are set, so name the file only
        # when no version was passed.
        python-version-file: ${{ inputs.python-version == '' && '.github/.python-version' || '' }}
        cache: poetry
