name: Set up Poetry
description: Install Poetry and Python for a given version, with Poetry's download cache.

# No `poetry install`: callers that run project code install the environment
# themselves, so callers that only build or inspect skip the cost.
#
# A local composite action can't check out the repo it lives in, so
# callers run actions/checkout before invoking it.
inputs:
  python-version:
    description: Python version passed to actions/setup-python.
    required: true

runs:
  using: composite
  steps:
    - name: install poetry
      shell: bash
      run: pipx install 'poetry<3'
    - name: setup python-${{ inputs.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: poetry
