[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.10,<0.14"]

[dependency-groups]
mutation = ["mutmut==3.8.1"]
test = [
  "hypothesis==6.170.17",
  # The floor is the first release past GHSA-6w46-j5rx-g56g (tmpdir handling);
  # anything older resolves into the advisory range and fails dependency review.
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-mock==3.17.0",
  "pytest-randomly==5.1.0"
]

[project]
authors = [{ name = "Alex Brandt", email = "alunduil@gmail.com" }]
# The Python version classifiers list the CPython releases ci.yml tests.
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: System",
  "Topic :: System :: Archiving",
  "Topic :: System :: Filesystems"
]
# click.Choice became subscriptable in 8.2, which EnumChoice requires. The
# ceilings guard click-log, which declares no click bound of its own and is
# dormant upstream, so a major bump on either side has no upstream fix.
dependencies = ["click>=8.2,<9", "click-log>=0.4.0,<0.5"]
description = "ZFS Snapshot Replicator"
keywords = ["zfs", "replication", "backup", "remote"]
license = "BSD-2-Clause"
license-files = ["LICENSE"]
name = "zfs-replicate"
readme = "README.md"
requires-python = ">=3.11,<4.0"
version = "4.1.0"

[project.scripts]
zfs-replicate = "zfs.replicate.cli.main:main"

[project.urls]
repository = "https://github.com/alunduil/zfs-replicate"

[tool.coverage.report]
# mypy proves an assert_never arm unreachable, so no test can run it.
exclude_also = ["case _:\\n\\s*assert_never\\("]

[tool.coverage.run]
# relative_files keeps the XML report's <source> from being the runner's
# absolute checkout path, which Codecov would have to strip before the
# filenames reach the zfs/ paths it reports against.
relative_files = true
source = ["zfs"]

[tool.fawltydeps]
ignore_unused = ["mutmut", "pytest-cov", "pytest-randomly"]

[tool.mutmut]
# mutmut runs pytest from a copy of the tree under mutants/, so testpaths only
# resolves if the suite is copied alongside the mutated zfs/.
also_copy = ["zfs_test"]
pytest_add_cli_args_test_selection = ["zfs_test"]
source_paths = ["zfs"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
# Coverage is off here so the version matrix and mutmut's per-mutant runs
# don't pay for it. The callers that want it pass --cov on the command line.
addopts = "--doctest-modules"
# zfs/ has no __init__.py. Without this, pytest imports the doctest modules a
# second time as a top-level replicate package, apart from zfs.replicate.
consider_namespace_packages = true
testpaths = ["zfs", "zfs_test"]

[tool.ruff]
# target-version is intentionally unset: ruff infers it from the project's
# requires-python, so the Python floor has one source of truth.
line-length = 120
src = ["."]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# Groups deliberately absent:
# A          the public API is named for zfs subcommands: list, type, open.
# ANN        mypy strict already demands the annotations.
# COM        COM812 disagrees with ruff format about trailing commas.
# CPY        the license sits at the repository root, not in file headers.
# DOC        every rule is preview-gated, so selecting it enforces nothing.
# FBT        readonly, recursive, and follow_delete would become keyword-only.
# FIX, TD    work is tracked in issues rather than in-code TODOs.
# INP        cli_test and task_test still lack an __init__.py.
# ISC        ruff format already joins implicit string concatenations.
# PTH        os.path here assembles zfs dataset names, not filesystem paths.
# TID        the package imports relatively throughout.
select = [
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "D",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INT",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
  "YTT"
]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101) and compare against literal expectations (PLR2004) by design.
"zfs_test/**" = ["PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
# D203/D211 and D212/D213 are incompatible pairs; naming a convention settles
# each one instead of leaving ruff to warn and choose.
convention = "pep257"

[tool.uv]
# The mutation group stays out of a plain sync, so the pull request test legs
# skip mutmut and the libcst and textual trees behind it.
default-groups = ["test"]

[tool.uv.build-backend]
module-name = "zfs"
module-root = ""
# zfs has no __init__.py: zfs.replicate is a namespace package beneath it.
namespace = true
# The sdist carries the suite so downstream packagers can test the build.
source-include = ["zfs_test/**"]

[tool.vulture]
paths = ["zfs", "zfs_test"]
