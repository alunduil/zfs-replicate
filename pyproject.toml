[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]

[project]
authors = [{name = "Alex Brandt", email = "alunduil@gmail.com"}]
description = "ZFS Snapshot Replicator"
# classifiers and dependencies are dynamic so Poetry generates the Python-version
# and license classifiers from the constraints and keeps its richer dependency syntax.
dynamic = ["classifiers", "dependencies"]
keywords = ["zfs", "replication", "backup", "remote"]
license = "BSD-2-Clause"
name = "zfs-replicate"
readme = "README.md"
requires-python = ">=3.10,<4.0"
version = "4.1.0"

[project.scripts]
zfs-replicate = "zfs.replicate.cli.main:main"

[project.urls]
repository = "https://github.com/alunduil/zfs-replicate"

[tool.fawltydeps]
ignore_unused = ["coveralls", "mutmut", "pytest-cov", "vale"]

[tool.mutmut]
# mutmut runs pytest from a copy of the tree under mutants/, so testpaths only
# resolves if the suite is copied alongside the mutated zfs/.
also_copy = ["zfs_test"]
pytest_add_cli_args_test_selection = ["zfs_test"]
source_paths = ["zfs"]

[tool.mypy]
strict = true

[tool.poetry]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System",
  "Topic :: System :: Archiving",
  "Topic :: System :: Filesystems"
]
packages = [{include = "zfs"}, {include = "zfs_test", format = "sdist"}]
requires-poetry = ">=2.0"

[tool.poetry.dependencies]
# click.Choice became subscriptable in 8.2, which EnumChoice requires. The
# ceilings guard click-log, which declares no click bound of its own and is
# dormant upstream, so a major bump on either side has no upstream fix.
click = ">=8.2,<9"
click-log = ">=0.4.0,<0.5"
python = "^3.10"

[tool.poetry.group.mutation]
# Optional so the pull request test legs skip mutmut and the libcst and textual
# trees behind it.
optional = true

[tool.poetry.group.mutation.dependencies]
mutmut = "==3.7.0"

[tool.poetry.group.test.dependencies]
coveralls = "==4.1.0"
hypothesis = "6.165.10"
# The floor is the first release past GHSA-6w46-j5rx-g56g (tmpdir handling);
# anything older resolves into the advisory range and fails dependency review.
pytest = "==9.1.1"
pytest-cov = "==7.1.0"

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov=zfs --cov-report=term-missing"
testpaths = ["zfs_test"]

[tool.ruff]
# target-version is intentionally unset: ruff infers it from the project's
# requires-python, so the Python floor has one source of truth.
line-length = 120
src = ["."]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# UP (pyupgrade) is intentionally omitted here: enabling it rewrites ~99 typing
# annotations across the tree, deferred to keep this migration reviewable (#501).
# PGH and RUF100 stand in for the removed pygrep-hooks and yesqa hooks; G010 for
# python-no-log-warn; S (above) covers python-no-eval and the bandit rule set.
select = ["E", "F", "I", "B", "SIM", "D", "N", "S", "G010", "PGH", "PL", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101) and compare against literal expectations (PLR2004) by design.
"zfs_test/**" = ["PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.vulture]
paths = ["zfs", "zfs_test"]
