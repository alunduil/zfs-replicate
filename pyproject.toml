[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]

[project]
authors = [{name = "Alex Brandt", email = "alunduil@gmail.com"}]
description = "ZFS Snapshot Replicator"
# classifiers and dependencies are dynamic so Poetry generates the Python-version
# and license classifiers from the constraints and keeps its richer dependency syntax.
dynamic = ["classifiers", "dependencies"]
keywords = ["zfs", "replication", "backup", "remote"]
license = "BSD-2-Clause"
name = "zfs-replicate"
readme = "README.md"
requires-python = ">=3.10,<4.0"
version = "4.1.0"

[project.scripts]
zfs-replicate = "zfs.replicate.cli.main:main"

[project.urls]
repository = "https://github.com/alunduil/zfs-replicate"

[tool.coverage.run]
# relative_files keeps the XML report's <source> from being the runner's
# absolute checkout path, which Codecov would have to strip before the
# filenames reach the zfs/ paths it reports against.
relative_files = true
source = ["zfs"]

[tool.fawltydeps]
ignore_unused = ["mutmut", "pytest-cov", "pytest-randomly", "vale"]

[tool.mutmut]
# mutmut runs pytest from a copy of the tree under mutants/, so testpaths only
# resolves if the suite is copied alongside the mutated zfs/.
also_copy = ["zfs_test"]
pytest_add_cli_args_test_selection = ["zfs_test"]
source_paths = ["zfs"]

[tool.mypy]
strict = true

[tool.poetry]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System",
  "Topic :: System :: Archiving",
  "Topic :: System :: Filesystems"
]
packages = [{include = "zfs"}, {include = "zfs_test", format = "sdist"}]
requires-poetry = ">=2.0"

[tool.poetry.dependencies]
# click.Choice became subscriptable in 8.2, which EnumChoice requires. The
# ceilings guard click-log, which declares no click bound of its own and is
# dormant upstream, so a major bump on either side has no upstream fix.
click = ">=8.2,<9"
click-log = ">=0.4.0,<0.5"
python = "^3.10"

[tool.poetry.group.mutation]
# Optional so the pull request test legs skip mutmut and the libcst and textual
# trees behind it.
optional = true

[tool.poetry.group.mutation.dependencies]
mutmut = "==3.7.0"

[tool.poetry.group.test.dependencies]
hypothesis = "6.165.10"
# The floor is the first release past GHSA-6w46-j5rx-g56g (tmpdir handling);
# anything older resolves into the advisory range and fails dependency review.
pytest = "==9.1.1"
pytest-cov = "==7.1.0"
pytest-mock = "==3.15.1"
pytest-randomly = "==4.1.0"

[tool.pytest.ini_options]
# Coverage is off here so the version matrix and mutmut's per-mutant runs
# don't pay for it. The callers that want it pass --cov on the command line.
addopts = "--doctest-modules"
testpaths = ["zfs_test"]

[tool.ruff]
# target-version is intentionally unset: ruff infers it from the project's
# requires-python, so the Python floor has one source of truth.
line-length = 120
src = ["."]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# Groups deliberately absent:
# A          modules named for zfs subcommands shadow list, type, and open.
# ANN        mypy strict already demands the annotations.
# COM        COM812 disagrees with ruff format about trailing commas.
# CPY        the license sits at the repository root, not in file headers.
# DOC        every rule is preview-gated, so selecting it enforces nothing.
# FBT        readonly, recursive, and follow_delete would become keyword-only.
# FIX, TD    work is tracked in issues rather than in-code TODOs.
# INP        cli_test and task_test still lack an __init__.py.
# ISC        ruff format already joins implicit string concatenations.
# PTH        os.path here assembles zfs dataset names, not filesystem paths.
# TID        the package imports relatively throughout.
# UP         enabling it rewrites about 130 typing annotations.
select = [
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "D",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INT",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TRY",
  "W",
  "YTT"
]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101) and compare against literal expectations (PLR2004) by design.
"zfs_test/**" = ["PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.vulture]
paths = ["zfs", "zfs_test"]
