# Per-tool python needs 2026.10.12.
min_version = "2026.10.12"

[settings]
locked = true

[tools]
# mise has no aqua or core backend for Poetry. Its locked dependency graph
# installs only under a mise-managed interpreter; this one stays private to
# Poetry, and project venvs still take the python on PATH.
"pypi:poetry" = { version = "2.5.1", python = "3.14" }
# pypi: tools lock their dependency graph, the uv.lock sidecar under .mise/,
# only when uv installs them.
uv = "0.13.6"
