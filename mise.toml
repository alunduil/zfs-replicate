# A tool's python option needs this release.
min_version = "2026.10.12"

[settings]
locked = true

[tools]
# mise has no aqua or core backend for Poetry. Poetry's locked dependency graph
# installs only under a mise-managed Python, which the python option keeps
# private to Poetry. Project venvs still use the python on PATH.
"pypi:poetry" = { version = "2.5.1", python = "3.14" }
# pypi: tools get a locked dependency graph only when uv installs them.
uv = "0.13.6"
