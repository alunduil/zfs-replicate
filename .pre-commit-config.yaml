# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Renovate extracts a hook's additional_dependencies only when the entry
# declares a language, so each pinned hook spells out language: python. The
# declaration restates the hook's own and builds the same environment.
# Hoisting it into a YAML merge key resolves for pre-commit and leaves
# Renovate extracting nothing.
default_install_hook_types:
  - pre-commit
  - commit-msg
ci:
  autofix_prs: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: destroyed-symlinks
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: debug-statements
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # click and hypothesis ship py.typed. Without them in the hook's
        # environment --ignore-missing-imports degrades every decorator they
        # export to Any, which strict mode then reports as an untyped
        # decorator at each of the ~25 call sites.
        #
        # The pins are the versions poetry.lock resolves, so mypy reads the
        # annotations the suite runs against.
        language: python
        additional_dependencies:
          - click==8.5.0
          - click-log==0.4.0
          - hypothesis==6.165.10
          - pytest==9.1.1
          - pytest-mock==3.15.1
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-toml
        args: [--autofix]
        exclude: poetry\.lock
        # toml-sort's formatting changes between releases and the hook sets no
        # upper bound, so without a pin a cache rebuild reformats
        # pyproject.toml.
        language: python
        additional_dependencies:
          - toml-sort==0.25.0
  - repo: https://github.com/tweag/FawltyDeps
    rev: v0.20.0
    hooks:
      - id: check-undeclared
      - id: check-unused
  - repo: https://github.com/errata-ai/vale
    rev: v3.17.1
    hooks:
      - id: vale
        exclude: '^(styles/|LICENSE$)'
        exclude_types:
          - gitignore
          - ini
          - json
          - python
          - shell
          - toml
          - yaml
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.35.3
    hooks:
      - id: renovate-config-validator
        args:
          - --strict
          - --no-global
  # Advisory local mirror of the pr-title job in ci.yml, catching a bad type at
  # commit time. The commit-msg stage keeps it out of `pre-commit run`, so it
  # stays bypassable and never becomes a second gate. Keep the type list in sync
  # with that job and CONTRIBUTING.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg
        args:
          - feat
          - fix
          - perf
          - refactor
          - docs
          - test
          - build
          - ci
          - chore
          - revert
