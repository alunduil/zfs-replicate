# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types:
  - pre-commit
  - commit-msg
ci:
  autofix_prs: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: destroyed-symlinks
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: debug-statements
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # click and hypothesis ship py.typed. Without them in the hook's
        # environment --ignore-missing-imports degrades every decorator they
        # export to Any, which strict mode then reports as an untyped
        # decorator at each of the ~25 call sites.
        additional_dependencies:
          - click
          - click-log
          - hypothesis
          - pytest
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-toml
        args: [--autofix]
        exclude: poetry\.lock
  - repo: https://github.com/tweag/FawltyDeps
    rev: v0.20.0
    hooks:
      - id: check-undeclared
      - id: check-unused
  - repo: https://github.com/errata-ai/vale
    rev: v3.15.2
    hooks:
      - id: vale
        exclude: '^(styles/|LICENSE$|\.envrc$)'
        exclude_types:
          - gitignore
          - ini
          - json
          - nix
          - python
          - shell
          - toml
          - yaml
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 43.288.0
    hooks:
      - id: renovate-config-validator
        args:
          - --strict
          - --no-global
  # Advisory local mirror of the Semantic Pull Request workflow: catches a bad
  # type at commit time. commit-msg stage keeps it out of `pre-commit run`, so
  # it never becomes a CI gate and stays bypassable (--no-verify). Keep the
  # type list in sync with that workflow and CONTRIBUTING.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg
        args:
          - feat
          - fix
          - perf
          - refactor
          - docs
          - test
          - build
          - ci
          - chore
          - revert
